name: veil-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: veil
      POSTGRES_USER: veil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veil -d veil"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  synapse:
    image: matrixdotorg/synapse:v1.160.0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SYNAPSE_PORT:-8008}:8008"
    volumes:
      - ../.local/synapse:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8008/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: Server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: veil
      DATABASE_USERNAME: veil
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      OWNERSHIP_KEY_BASE64: ${OWNERSHIP_KEY_BASE64}
      MATRIX_HOMESERVER_URL: http://synapse:8008
      MATRIX_PUBLIC_HOMESERVER_URL: ${MATRIX_PUBLIC_HOMESERVER_URL}
      MATRIX_REGISTRATION_SECRET: ${MATRIX_REGISTRATION_SECRET}
      MODERATOR_API_KEY: ${MODERATOR_API_KEY}
      UPLOAD_DIRECTORY: /app/Public/uploads
      LOG_LEVEL: info
    ports:
      - "${VEIL_API_PORT:-8080}:8080"
    volumes:
      - uploads:/app/Public/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
  uploads:
